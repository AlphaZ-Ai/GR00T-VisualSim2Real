  finger_primitive:  # Use with FingerPrimitiveBase. Must set actions_dim to 31. All primitive dofs must be after non-primitive dofs.
    num_non_primitive_dof: 29
    primitive_action_map:
      left:
        dof_names: ['left_dex1_finger_joint_1', 'left_dex1_finger_joint_2']
        pos_0: null
        pos_1: null
        inheritrange: 1.0
        mode: "linear"
      right:
        dof_names: ['right_dex1_finger_joint_1', 'right_dex1_finger_joint_2']
        pos_0: null
        pos_1: null
        inheritrange: 1.0
        mode: "linear"

  body_names: [
    'pelvis',
    'left_hip_pitch_link', 'right_hip_pitch_link', 'waist_yaw_link', 'left_hip_roll_link', 'right_hip_roll_link',
