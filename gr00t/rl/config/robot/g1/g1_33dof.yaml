  right_fingers_palm_body_names: ['right_dex1_finger_link_1', 'right_dex1_finger_link_2']

  left_hand_palm_side_direction:  ['+x', '+x']   # grasping direction per finger link — tune after USD import
  right_hand_palm_side_direction: ['+x', '+x']

  terminate_after_contacts_on : ["torso", "head", "knee"]
  penalize_contacts_on: ["pelvis", "shoulder", "hip"]
  init_state:
    pos: [0.0, 0.0, 0.75] # x,y,z [m]
    rot: [0.0, 0.0, 0.0, 1.0] # x,y,z,w [quat]
    lin_vel: [0.0, 0.0, 0.0]  # x,y,z [m/s]
    ang_vel: [0.0, 0.0, 0.0]  # x,y,z [rad/s]
    default_joint_angles: # = target angles [rad] when action = 0.0
      left_hip_pitch_joint: -0.1
      left_hip_roll_joint: 0.
      left_hip_yaw_joint: 0.
      left_knee_joint: 0.3
      left_ankle_pitch_joint: -0.2
      left_ankle_roll_joint: 0.
      right_hip_pitch_joint: -0.1
      right_hip_roll_joint: 0.
      right_hip_yaw_joint: 0.
      right_knee_joint: 0.3
      right_ankle_pitch_joint: -0.2
      right_ankle_roll_joint: 0.
      waist_yaw_joint : 0.
      waist_roll_joint : 0.
      waist_pitch_joint : 0.
      left_shoulder_pitch_joint: 0
      left_shoulder_roll_joint: 0
      left_shoulder_yaw_joint: 0.
      left_elbow_joint: 0
      left_wrist_roll_joint: 0
      left_wrist_pitch_joint: 0.
      left_wrist_yaw_joint: 0.
      right_shoulder_pitch_joint: 0
      right_shoulder_roll_joint: 0
      right_shoulder_yaw_joint: 0.
      right_elbow_joint: 0
      right_wrist_roll_joint: 0
      right_wrist_pitch_joint: 0.
      right_wrist_yaw_joint: 0.
      left_dex1_finger_joint_1: 0.
      left_dex1_finger_joint_2: 0.
      right_dex1_finger_joint_1: 0.
      right_dex1_finger_joint_2: 0.

  randomize_link_body_names: [
    'pelvis', 'left_hip_yaw_link', 'left_hip_roll_link', 'left_hip_pitch_link', 'left_knee_link',
    'right_hip_yaw_link', 'right_hip_roll_link', 'right_hip_pitch_link', 'right_knee_link',
  ]

  control:
    control_type: P
    stiffness: # [N*m/rad] for revolute, [N/m] for prismatic
      hip_yaw: 150
      hip_roll: 150
      hip_pitch: 150
      knee: 200
      ankle_pitch: 40
      ankle_roll: 40
      waist_yaw: 250
      waist_roll: 250
      waist_pitch: 250
      shoulder_pitch: 100
      shoulder_roll: 100
      shoulder_yaw: 40
      elbow: 40
      wrist_roll: 20
      wrist_pitch: 20
      wrist_yaw: 20
      dex1_finger: 200.0

    damping: # [N*m*s/rad] for revolute, [N*s/m] for prismatic
      hip_yaw: 2.0
      hip_roll: 2.0
      hip_pitch: 2.0
      knee: 4.0
      ankle_pitch: 2.0
      ankle_roll: 2.0
      waist_yaw: 5.0
      waist_roll: 5.0
      waist_pitch: 5.0
      shoulder_pitch: 5.0
      shoulder_roll: 5.0
      shoulder_yaw: 2.0
      elbow: 2.0
      wrist_roll: 2.0
      wrist_pitch: 2.0
      wrist_yaw: 2.0
      dex1_finger: 20.0

    action_scale: 0.25
    action_clip_value: 100.0
    clip_torques: True

  asset:
    collapse_fixed_joints: True
    replace_cylinder_with_capsule: True
    flip_visual_attachments: False
    armature: 0.001
    thickness: 0.01
    max_angular_velocity: 1000.
    max_linear_velocity: 1000.
    density: 0.001
    angular_damping: 0.01
    linear_damping: 0.01

    urdf_file: "g1/${robot.asset.robot_type}.urdf"
    usd_file: "g1/${robot.asset.robot_type}.usda"
    xml_file: "g1/${robot.asset.robot_type}.xml"
    robot_type: g1_33dof
    self_collisions: 1 # 1 to disable, 0 to enable self collisions
    default_dof_drive_mode: 3

    fix_base_link: False
