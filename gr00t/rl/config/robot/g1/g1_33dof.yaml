  num_bodies: 34  # verify after USD import: 30 base + 4 dex1 finger links
  dof_obs_size: 33
  homie_dof_obs_size: 29
  actions_dim: 33
  lower_body_actions_dim: 15
  upper_body_actions_dim: 18
  body_keys: ["lower_body", "upper_body"]
  policy_obs_dim: -1
